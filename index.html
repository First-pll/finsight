<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>FinSight · 个人理财仪表盘</title>
<link rel="stylesheet" href="style.css?v=20260806f">
<script src="vendor/chart.umd.min.js"></script>
</head>
<body>
<aside class="sidebar">
  <div class="brand">◈ FinSight<span>财务洞察仪表盘</span></div>
  <nav class="nav">
    <button class="nav-item active" data-view="dashboard">◉ 总览</button>
    <button class="nav-item" data-view="transactions">⇅ 记账</button>
    <button class="nav-item" data-view="budget">▤ 预算</button>
    <button class="nav-item" data-view="settings">⚙ 数据管理</button>
  </nav>
  <div class="side-note">数据仅存本地<br>不上传任何服务器</div>
</aside>

<main class="main">
  <!-- ============ 总览 ============ -->
  <section class="view active" id="view-dashboard">
    <div class="kpis">
      <div class="card kpi"><span class="kpi-label">本月收入</span><span class="kpi-value income" id="kpiIncome">¥0</span></div>
      <div class="card kpi"><span class="kpi-label">本月支出</span><span class="kpi-value expense" id="kpiExpense">¥0</span></div>
      <div class="card kpi"><span class="kpi-label">本月结余</span><span class="kpi-value" id="kpiNet">¥0</span></div>
      <div class="card kpi"><span class="kpi-label">预算使用</span><span class="kpi-value" id="kpiBudget">—</span></div>
    </div>
    <div class="grid2">
      <div class="card"><div class="card-title">近 6 月收支趋势</div><div class="chart-box"><canvas id="trendChart"></canvas></div></div>
      <div class="card"><div class="card-title">本月支出分类占比</div><div class="chart-box"><canvas id="pieChart"></canvas></div></div>
    </div>
    <div class="card">
      <div class="card-title-row"><div class="card-title">最近交易</div><button class="btn btn-ghost" id="btnGoTx">查看全部 →</button></div>
      <div id="recentTx"></div>
    </div>
  </section>

  <!-- ============ 记账 ============ -->
  <section class="view" id="view-transactions">
    <div class="card">
      <div class="card-title-row">
        <div class="card-title">记一笔</div>
        <div class="month-nav">
          <button class="icon-btn" id="prevMonth">‹</button>
          <span id="monthLabel">2026-08</span>
          <button class="icon-btn" id="nextMonth">›</button>
          <button class="btn btn-ghost sm" id="btnToday">今</button>
        </div>
      </div>
      <div class="tx-form">
        <div class="seg" id="txTypeSeg">
          <button class="seg-btn active" data-tx-type="expense">支出</button>
          <button class="seg-btn" data-tx-type="income">收入</button>
        </div>
        <label class="field"><span>金额 (¥)</span><input type="number" id="txAmount" class="input big" min="0" step="0.01" placeholder="0.00"></label>
        <label class="field"><span>分类</span><select id="txCategory" class="input"></select></label>
        <label class="field"><span>日期</span><input type="date" id="txDate" class="input"></label>
        <label class="field"><span>备注</span><input type="text" id="txNote" class="input" placeholder="可选"></label>
        <div class="form-actions">
          <button class="btn btn-primary" id="txSave">保存这笔</button>
          <button class="btn btn-ghost" id="txReset">清空</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title-row">
        <div class="card-title">全部流水 <span class="muted" id="txCount"></span></div>
        <div class="filters">
          <select id="filterType" class="input sm"><option value="all">全部类型</option><option value="expense">支出</option><option value="income">收入</option></select>
          <select id="filterCategory" class="input sm"><option value="all">全部分类</option></select>
        </div>
      </div>
      <div class="table-wrap">
        <table class="tx-table">
          <thead><tr><th>日期</th><th>类型</th><th>分类</th><th>备注</th><th class="r">金额</th><th class="r">操作</th></tr></thead>
          <tbody id="txTableBody"></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- ============ 预算 ============ -->
  <section class="view" id="view-budget">
    <div class="card">
      <div class="card-title-row">
        <div class="card-title">每月分类预算 <span class="muted" id="budgetMonthLabel"></span></div>
        <button class="btn btn-primary" id="budgetSave">保存预算</button>
      </div>
      <p class="muted">预算为每月固定额度，留空表示该分类不设预算。填入金额后点「保存预算」。</p>
      <div class="budget-form" id="budgetForm"></div>
      <div class="budget-summary" id="budgetSummary"></div>
    </div>
  </section>

  <!-- ============ 数据管理 ============ -->
  <section class="view" id="view-settings">
    <div class="card">
      <div class="card-title">数据管理</div>
      <p class="muted">所有数据仅存储在你的浏览器本地（localStorage），不会上传到任何服务器。换设备或清缓存前请先导出备份。</p>
      <div class="settings-row">
        <button class="btn btn-ghost" id="btnExport">⬇ 导出数据 (JSON)</button>
        <button class="btn btn-ghost" id="btnImport">⬆ 导入数据</button>
        <button class="btn btn-ghost" id="btnSample">✦ 载入示例数据</button>
        <button class="btn btn-danger" id="btnClear">✕ 清空全部数据</button>
      </div>
      <input type="file" id="importFile" accept=".json" class="hidden-file">
    </div>
  </section>
</main>

<div id="toast"></div>
<script src="app.js?v=20260806f"></script>
</body>
</html>
