<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>FinSight · 个人理财仪表盘</title>
<meta name="description" content="FinSight — 个人理财仪表盘：记账、预算与储蓄目标可视化">
<link rel="stylesheet" href="style.css?v=20260806c">
<script src="vendor/chart.umd.min.js"></script>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="brand-logo">◈</div>
    <div class="brand-text">
      <div class="brand-name">FinSight</div>
      <div class="brand-sub">财务洞察仪表盘</div>
    </div>
  </div>
  <nav class="nav">
    <button class="nav-item active" data-view="dashboard"><span class="nav-ico">◉</span>总览</button>
    <button class="nav-item" data-view="transactions"><span class="nav-ico">⇅</span>记账</button>
    <button class="nav-item" data-view="budget"><span class="nav-ico">▤</span>预算</button>
    <button class="nav-item" data-view="goals"><span class="nav-ico">◎</span>储蓄目标</button>
    <button class="nav-item" data-view="settings"><span class="nav-ico">⚙</span>数据管理</button>
  </nav>
  <div class="sidebar-foot">数据仅保存在本机浏览器</div>
</aside>

<main class="main">
  <header class="topbar">
    <div class="month-nav">
      <button class="icon-btn" id="prevMonth" title="上个月">‹</button>
      <span class="month-label" id="monthLabel">2026年8月</span>
      <button class="icon-btn" id="nextMonth" title="下个月">›</button>
      <button class="icon-btn" id="btnToday" title="回到本月">今</button>
    </div>
    <div class="topbar-right">
      <span class="net-chip" id="netChip">本月结余 ¥0</span>
      <button class="btn btn-primary" id="btnAdd">＋ 记一笔</button>
    </div>
  </header>

  <!-- 总览 -->
  <section class="view active" id="view-dashboard">
    <div class="kpi-grid">
      <div class="kpi card">
        <div class="kpi-label">本月收入</div>
        <div class="kpi-value income" id="kpiIncome">¥0</div>
        <div class="kpi-trend" id="kpiIncomeTrend">—</div>
      </div>
      <div class="kpi card">
        <div class="kpi-label">本月支出</div>
        <div class="kpi-value expense" id="kpiExpense">¥0</div>
        <div class="kpi-trend" id="kpiExpenseTrend">—</div>
      </div>
      <div class="kpi card">
        <div class="kpi-label">本月结余</div>
        <div class="kpi-value" id="kpiNet">¥0</div>
        <div class="kpi-trend" id="kpiNetTrend">—</div>
      </div>
      <div class="kpi card">
        <div class="kpi-label">储蓄目标进度</div>
        <div class="kpi-value" id="kpiGoal">—</div>
        <div class="mini-bar"><div class="mini-bar-fill" id="kpiGoalBar"></div></div>
      </div>
    </div>

    <div class="chart-row">
      <div class="card chart-card">
        <div class="card-title">近 6 个月收支趋势</div>
        <div class="chart-wrap"><canvas id="chartTrend"></canvas></div>
      </div>
      <div class="card chart-card">
        <div class="card-title">本月支出分类占比</div>
        <div class="chart-wrap"><canvas id="chartPie"></canvas></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title-row">
        <div class="card-title">最近交易</div>
        <button class="link-btn" id="goTransactions">查看全部 →</button>
      </div>
      <div class="tx-list" id="recentTx"></div>
    </div>
  </section>

  <!-- 记账 -->
  <section class="view" id="view-transactions">
    <div class="card">
      <div class="card-title-row">
        <div class="card-title">全部交易 <span class="muted" id="txCount"></span></div>
        <div class="filter-row">
          <select id="filterType" class="input">
            <option value="all">全部类型</option>
            <option value="expense">支出</option>
            <option value="income">收入</option>
          </select>
          <select id="filterCategory" class="input"></select>
        </div>
      </div>
      <div class="tx-table-wrap">
        <table class="tx-table">
          <thead>
            <tr><th>日期</th><th>类型</th><th>分类</th><th>备注</th><th class="r">金额</th><th class="r">操作</th></tr>
          </thead>
          <tbody id="txTableBody"></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- 预算 -->
  <section class="view" id="view-budget">
    <div class="card">
      <div class="card-title-row">
        <div class="card-title">本月分类预算 <span class="muted" id="budgetMonthLabel"></span></div>
        <button class="btn btn-ghost" id="btnEditBudget">⚙ 编辑预算</button>
      </div>
      <div class="budget-summary" id="budgetSummary"></div>
      <div class="budget-list" id="budgetList"></div>
    </div>
  </section>

  <!-- 储蓄目标 -->
  <section class="view" id="view-goals">
    <div class="card">
      <div class="card-title-row">
        <div class="card-title">储蓄目标</div>
      </div>
      <div class="goal-grid" id="goalGrid"></div>
    </div>
  </section>

  <!-- 数据管理 -->
  <section class="view" id="view-settings">
    <div class="card">
      <div class="card-title">数据管理</div>
      <p class="muted">所有数据仅存储在你的浏览器本地（localStorage），不会上传到任何服务器。</p>
      <div class="settings-row">
        <button class="btn btn-ghost" id="btnExport">⬇ 导出数据 (JSON)</button>
        <button class="btn btn-ghost" id="btnImport">⬆ 导入数据</button>
        <input type="file" id="importFile" accept=".json" hidden>
      </div>
      <div class="settings-row">
        <button class="btn btn-ghost" id="btnSample">✦ 载入示例数据</button>
        <button class="btn btn-danger" id="btnClear">✕ 清空全部数据</button>
      </div>
      <hr>
      <div class="card-title" style="margin-top:4px">关于</div>
      <p class="muted">FinSight — 个人理财仪表盘。开源项目，用于记账、预算管理、储蓄目标追踪与消费结构分析。</p>
    </div>
  </section>
</main>

<!-- 交易模态框 -->
<div class="modal-mask" id="txModal" hidden>
  <div class="modal">
    <div class="modal-head">
      <span id="txModalTitle">记一笔</span>
      <button class="icon-btn" data-close onclick="this.closest('.modal-mask').hidden=true">✕</button>
    </div>
    <div class="seg" id="txTypeSeg">
      <button class="seg-btn active" data-tx-type="expense">支出</button>
      <button class="seg-btn" data-tx-type="income">收入</button>
    </div>
    <label class="field"><span>金额 (¥)</span><input type="number" id="txAmount" class="input big" min="0" step="0.01" placeholder="0.00"></label>
    <label class="field"><span>分类</span><select id="txCategory" class="input"></select></label>
    <label class="field"><span>日期</span><input type="date" id="txDate" class="input"></label>
    <label class="field"><span>备注</span><input type="text" id="txNote" class="input" placeholder="可选"></label>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-close onclick="this.closest('.modal-mask').hidden=true">取消</button>
      <button class="btn btn-primary" id="txSave" onclick="saveTx()">保存</button>
    </div>
  </div>
</div>

<!-- 预算编辑模态框 -->
<div class="modal-mask" id="budgetModal" hidden>
  <div class="modal">
    <div class="modal-head">
      <span>编辑每月分类预算</span>
      <button class="icon-btn" data-close onclick="this.closest('.modal-mask').hidden=true">✕</button>
    </div>
    <p class="muted">预算为每月的固定额度，设置后按月生效。留空表示该分类不设预算。</p>
    <div id="budgetForm" class="budget-form"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-close onclick="this.closest('.modal-mask').hidden=true">取消</button>
      <button class="btn btn-primary" id="budgetSave" onclick="saveBudget()">保存预算</button>
    </div>
  </div>
</div>

<script src="app.js?v=20260806c"></script>
</body>
</html>
